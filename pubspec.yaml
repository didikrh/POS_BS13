name: pos_thermal_app
description: Aplikasi POS Android - printer thermal 58mm Bluetooth, scan barcode/QR, database SQLite ringan.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # --- Database transaksi: SQLite (via sqflite) ---
  # Dipilih karena PALING RINGAN untuk kebutuhan data relasional (transaksi +
  # item + produk + laporan dengan JOIN/agregat), karena SQLite sudah menjadi
  # bagian dari OS Android/iOS (tidak perlu bundling engine DB terpisah),
  # embedded (tanpa proses server), dan footprint memori sangat kecil.
  sqflite: ^2.3.3
  path: ^1.9.0
  path_provider: ^2.1.3

  # --- Koneksi printer thermal Bluetooth (Bluetooth Classic / SPP) ---
  # Mayoritas printer thermal 58mm murah memakai profil Bluetooth Classic
  # SPP (bukan BLE), sehingga paket ini paling kompatibel.
  # print_bluetooth_thermal: pengganti blue_thermal_printer (yang lama
  # sudah tidak dirawat & terbukti gagal connect di Android 14 - hanya
  # sampai "Paired", tidak pernah "Connected"). Paket ini aktif dirawat,
  # koneksinya dijaga via Kotlin Coroutine di sisi native (lebih stabil),
  # dan tidak mewajibkan izin lokasi untuk connect ke printer.
  print_bluetooth_thermal: ^1.2.2
  permission_handler: ^11.3.1

  # --- Scan barcode / QR Code (kamera, berbasis Google ML Kit) ---
  mobile_scanner: ^5.2.3

  # --- Generator QR Code & Barcode (murni Dart, tanpa perlu kamera/UI) ---
  qr: ^3.0.2          # encoder QR Code -> matrix bit (dipakai untuk raster cetak)
  barcode: ^2.2.8      # encoder Barcode 1D (Code128/Code39) -> bar width (untuk raster cetak)

  # --- Util umum ---
  intl: ^0.19.0
  uuid: ^4.4.0
  provider: ^6.1.2

  # --- Export/Import Template & Data ke Excel (.xlsx) ---
  # "excel" adalah library PURE DART (tidak ada kode native Android/iOS
  # sama sekali) - dipilih SENGAJA karena ini menghindari seluruh kelas
  # masalah yang sudah kita alami dengan blue_thermal_printer (namespace,
  # compileSdk, package attribute, dst - semua itu masalah level Gradle/
  # native Android yang TIDAK BISA terjadi pada library pure Dart).
  excel: ^4.0.6
  # file_picker dipakai untuk dialog "Simpan Sebagai" (export) & "Pilih
  # File" (import) yang mengikuti Storage Access Framework Android modern
  # (tidak butuh permission storage klasik yang sudah dibatasi Android 11+).
  file_picker: ^8.1.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/logo.png

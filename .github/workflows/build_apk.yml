name: Build Android APK

# Jalan otomatis setiap push ke branch main, ATAU bisa dipicu manual
# lewat tab "Actions" di GitHub (tombol "Run workflow").
on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout kode
        uses: actions/checkout@v4

      - name: Setup Java (dibutuhkan Android Gradle build)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          # DIKUNCI ke versi tertentu (bukan "stable" mengambang).
          #
          # Alasan perubahan: sebelumnya versi TIDAK dikunci dengan asumsi
          # "flutter create" akan selalu menghasilkan template yang
          # kompatibel dengan Flutter versi terbaru. Itu benar untuk
          # template BAWAAN Flutter sendiri, TAPI proyek ini bergantung
          # pada tool/patch_android.py yang mem-parsing/mengubah teks
          # build.gradle(.kts) hasil generate dengan regex. Setiap kali
          # Flutter merilis versi stable baru, bentuk template bisa
          # sedikit berubah (versi Kotlin/AGP/Gradle, gaya penulisan
          # compileOptions, dsb) SEBELUM patch script sempat disesuaikan
          # - inilah sumber "bug muncul satu per satu" tanpa ada perubahan
          # kode aplikasi. Mengunci versi membuat build 100% reproducible:
          # hijau hari ini = hijau bulan depan, sampai versi ini sengaja
          # dinaikkan (dan patch script diuji ulang bersamaan).
          #
          # Untuk naik versi: ubah angka di bawah, jalankan build lokal
          # dulu (flutter build apk --release) untuk pastikan
          # tool/patch_android.py masih cocok dengan template baru,
          # baru commit.
          flutter-version: '3.44.7'
          cache: true

      - name: Cek versi Flutter
        run: flutter --version

      - name: Generate folder android/ (jika belum ada)
        run: |
          if [ ! -f "android/app/src/main/AndroidManifest.xml" ]; then
            echo "Project Android belum di-scaffold, menjalankan flutter create ..."
            flutter create . --project-name pos_thermal_app --org com.tokoanda --platforms=android
          else
            echo "android/app/src/main/AndroidManifest.xml sudah ada, lewati flutter create."
          fi

      - name: Install dependencies
        run: flutter pub get

      - name: Patch permission, minSdkVersion, & namespace legacy plugin
        run: python3 tool/patch_android.py

      - name: Analisa kode (opsional, tidak menggagalkan build jika ada warning)
        run: flutter analyze || true

      - name: Build APK (release)
        run: flutter build apk --release

      - name: Upload APK sebagai artifact
        uses: actions/upload-artifact@v4
        with:
          name: pos-thermal-app-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30

      # ------------------------------------------------------------
      # OPSIONAL: buat GitHub Release otomatis + lampirkan APK, hanya
      # berjalan kalau push-nya berupa TAG versi (mis. "v1.0.0").
      # Cara pakai: git tag v1.0.0 && git push origin v1.0.0
      # ------------------------------------------------------------
      - name: Buat GitHub Release (hanya jika push tag v*)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: build/app/outputs/flutter-apk/app-release.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
